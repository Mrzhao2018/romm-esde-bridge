<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PC-98 Browser</title>
  <style>
    :root {
      --bg: #0b1011; --surface: #121a1b; --surface-2: #182324; --line: #2c3b3c;
      --text: #eef4f2; --muted: #9eafad; --accent: #70d5c2; --accent-2: #f2b86b;
      --danger: #f28c8c;
    }
    * { box-sizing: border-box }
    html, body { min-height: 100%; margin: 0 }
    body { color: var(--text); background: var(--bg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif }
    button, input, select { font: inherit }
    button { color: inherit; cursor: pointer }
    .shell { width: min(1440px, calc(100% - 40px)); margin: auto; padding: 24px 0 48px }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid var(--line) }
    .brand { display: flex; align-items: center; gap: 12px }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid #426967; color: var(--accent); background: #152525; font: 800 13px/1 ui-monospace, monospace; letter-spacing: 0 }
    h1, h2, p { margin: 0 }
    h1 { font-size: 19px; letter-spacing: 0 }
    .sub { color: var(--muted); font-size: 12px }
    .top-actions, .toolbar, .dialog-actions, .player-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px }
    .btn, .select, .search { min-height: 38px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text) }
    .btn { padding: 0 13px; font-weight: 700 }
    .btn:hover { border-color: var(--accent); background: var(--surface-2) }
    .btn.primary { border-color: #3d8d82; color: #071313; background: var(--accent) }
    .btn.warn { border-color: #8d6a3e; color: #17100a; background: var(--accent-2) }
    .btn.danger { border-color: #754242; color: #ffdada; background: #321b1c }
    .btn:disabled { cursor: wait; opacity: .48 }
    main { padding-top: 22px }
    .toolbar { justify-content: space-between; margin-bottom: 18px }
    .search { width: min(520px, 100%); padding: 0 13px; outline: 0 }
    .search:focus { border-color: var(--accent) }
    .summary { color: var(--muted); font-size: 12px }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px }
    .game { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); transition: border-color .15s, transform .15s }
    .game:hover { border-color: #578c86; transform: translateY(-2px) }
    .cover { display: block; width: 100%; aspect-ratio: 1 / 1.28; object-fit: cover; background: #1c2829 }
    .game-body { padding: 11px 12px 13px }
    .game-name { min-height: 42px; font-weight: 700; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2 }
    .game-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; color: var(--muted); font-size: 11px }
    .status { min-height: 22px; margin: 14px 0 0; color: var(--muted); font-size: 12px }
    .status.error { color: var(--danger) }
    dialog { width: min(680px, calc(100% - 24px)); border: 1px solid var(--line); border-radius: 8px; padding: 0; color: var(--text); background: var(--surface); box-shadow: 0 24px 80px #000b }
    dialog::backdrop { background: #000b }
    .dialog-inner { padding: 22px }
    .dialog-head { display: flex; justify-content: space-between; gap: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line) }
    .dialog-head h2 { font-size: 22px; line-height: 1.2 }
    .close { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; background: transparent; font-size: 20px; line-height: 1 }
    .dialog-copy { margin: 16px 0; color: var(--muted); white-space: pre-line }
    .disks { display: grid; gap: 8px; margin: 16px 0 20px }
    .disk-row { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--line); background: #101819 }
    .disk-row strong { color: var(--accent-2); font-size: 12px }
    .disk-row select { width: 100%; min-width: 0; padding: 7px 8px; border: 1px solid var(--line); border-radius: 4px; color: var(--text); background: var(--surface-2) }
    .pair-code { margin: 16px 0; padding: 17px; border: 1px solid #3f706b; background: #142424; text-align: center }
    .pair-code b { display: block; margin: 8px 0; color: var(--accent); font: 800 30px/1 ui-monospace, monospace; letter-spacing: 2px }
    .pair-code a { color: var(--accent); word-break: break-all }
    .empty { grid-column: 1 / -1; padding: 60px 20px; border: 1px dashed var(--line); color: var(--muted); text-align: center }
    @media (max-width: 680px) {
      .shell { width: min(100% - 24px, 1440px); padding-top: 14px }
      .topbar, .toolbar { align-items: stretch; flex-direction: column }
      .top-actions { justify-content: flex-start }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px }
      .game-body { padding: 9px }
      .disk-row { grid-template-columns: 58px 1fr }
      .disk-row .mini { grid-column: 2 }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">98</div>
        <div><h1>PC-98 Browser</h1><div class="sub">RomM Bridge / NP2Kai</div></div>
      </div>
      <div class="top-actions">
        <span class="sub" id="identity">未配对</span>
        <button class="btn" id="pair" type="button">配对浏览器</button>
        <button class="btn" id="refresh" type="button">刷新目录</button>
      </div>
    </header>
    <main>
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="搜索 PC-98 游戏" autocomplete="off">
        <div class="summary" id="summary">正在读取 manifest...</div>
      </div>
      <section class="grid" id="grid" aria-live="polite"></section>
      <div class="status" id="status"></div>
    </main>
  </div>

  <dialog id="game-dialog">
    <div class="dialog-inner">
      <div class="dialog-head"><h2 id="dialog-title"></h2><button class="close" id="dialog-close" type="button" aria-label="关闭">&times;</button></div>
      <p class="dialog-copy" id="dialog-copy"></p>
      <div class="disks" id="disks"></div>
      <div class="dialog-actions"><button class="btn primary" id="launch" type="button">启动会话</button><button class="btn" id="cancel" type="button">取消</button></div>
    </div>
  </dialog>
  <dialog id="pair-dialog">
    <div class="dialog-inner">
      <div class="dialog-head"><h2>配对此浏览器</h2><button class="close" id="pair-close" type="button" aria-label="关闭">&times;</button></div>
      <p class="dialog-copy">在 RomM 中批准这台浏览器后，Bridge 才会代表你的账户下载游戏和保存状态。</p>
      <div class="pair-code" id="pair-state">正在创建配对请求...</div>
      <div class="dialog-actions"><button class="btn" id="pair-cancel" type="button">关闭</button></div>
    </div>
  </dialog>
  <script>
    (() => {
      const BRIDGE = "@@BRIDGE_URL@@";
      const ROMM = "@@ROMM_URL@@";
      const TOKEN_KEY = "romm-esde-browser-token";
      const DEVICE_KEY = "romm-esde-browser-device";
      const grid = document.getElementById("grid");
      const status = document.getElementById("status");
      const summary = document.getElementById("summary");
      const search = document.getElementById("search");
      const identity = document.getElementById("identity");
      const gameDialog = document.getElementById("game-dialog");
      const pairDialog = document.getElementById("pair-dialog");
      let manifest = null;
      let selectedGame = null;
      let polling = null;
      let pairExpiryTimer = null;
      let pairPollBusy = false;

      const token = () => localStorage.getItem(TOKEN_KEY) || "";
      class ApiError extends Error {
        constructor(message, statusCode) { super(message); this.status = statusCode; }
      }
      function createDeviceIdentifier() {
        const webCrypto = window.crypto || window.msCrypto;
        if (webCrypto && typeof webCrypto.randomUUID === "function") {
          return webCrypto.randomUUID();
        }
        if (webCrypto && typeof webCrypto.getRandomValues === "function") {
          const bytes = new Uint8Array(16);
          webCrypto.getRandomValues(bytes);
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;
          const hex = Array.from(bytes, value => ("0" + value.toString(16)).slice(-2)).join("");
          return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
        }
        return `browser-${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
      }
      const setStatus = (message, error = false) => { status.textContent = message || ""; status.classList.toggle("error", error); };
      async function api(path, options = {}) {
        const headers = { "Accept": "application/json", ...(options.headers || {}) };
        if (token()) headers.Authorization = `Bearer ${token()}`;
        const response = await fetch(`${BRIDGE}${path}`, { ...options, headers });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new ApiError(body.error || `请求失败 (${response.status})`, response.status);
        return body;
      }
      function diskOptions(game) {
        return game.bridge.disk_options || game.bridge.canonical_file_ids.map((id, slot) => ({
          slot, canonical: { file_id: id, file_name: game.bridge.canonical_file_names[slot], role: "canonical" }, alternates: []
        }));
      }
      function render() {
        if (!manifest) return;
        const query = search.value.trim().toLocaleLowerCase();
        const games = manifest.roms.filter(game => !query || `${game.name} ${game.fs_name || ""}`.toLocaleLowerCase().includes(query));
        summary.textContent = `${games.length.toLocaleString("zh-CN")} / ${manifest.roms.length.toLocaleString("zh-CN")} 个游戏`;
        grid.replaceChildren();
        if (!games.length) { const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "没有匹配的游戏"; grid.append(empty); return; }
        for (const game of games) {
          const card = document.createElement("article"); card.className = "game";
          const image = document.createElement("img"); image.className = "cover"; image.loading = "lazy"; image.alt = "";
          image.src = game.bridge.cover_large?.url || game.bridge.cover_small?.url || "";
          const body = document.createElement("div"); body.className = "game-body";
          const title = document.createElement("div"); title.className = "game-name"; title.textContent = game.name || game.fs_name;
          const meta = document.createElement("div"); meta.className = "game-meta";
          const disks = diskOptions(game).length; meta.innerHTML = `<span>${disks > 1 ? `${disks} 张磁盘` : "单磁盘"}</span><span>${Math.round((game.bridge.canonical_size_bytes || 0) / 1024 / 1024 * 10) / 10} MB</span>`;
          body.append(title, meta); card.append(image, body); card.addEventListener("click", () => openGame(game)); grid.append(card);
        }
      }
      function openGame(game) {
        selectedGame = game; document.getElementById("dialog-title").textContent = game.name || game.fs_name;
        document.getElementById("dialog-copy").textContent = game.summary || "";
        const box = document.getElementById("disks"); box.replaceChildren();
        for (const option of diskOptions(game)) {
          const row = document.createElement("div"); row.className = "disk-row";
          const label = document.createElement("strong"); label.textContent = `磁盘 ${option.slot + 1}`;
          const select = document.createElement("select"); select.dataset.slot = option.slot;
          const choices = [option.canonical, ...(option.alternates || [])];
          choices.forEach((choice, index) => { const item = document.createElement("option"); item.value = choice.file_id; item.textContent = index ? `替代镜像 ${index}` : choice.file_name; select.append(item); });
          const mini = document.createElement("span"); mini.className = "sub mini"; mini.textContent = `${choices.length} 个选项`;
          row.append(label, select, mini); box.append(row);
        }
        gameDialog.showModal();
      }
      async function launch() {
        if (!selectedGame) return;
        const button = document.getElementById("launch"); button.disabled = true; setStatus("正在准备服务器会话...");
        try {
          if (!token()) throw new Error("请先完成浏览器配对");
          const ids = [...document.querySelectorAll("#disks select")].map(select => Number(select.value));
          const session = await api("/api/browser/sessions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ rom_id: selectedGame.id, device_id: localStorage.getItem(DEVICE_KEY), disk_file_ids: ids }) });
          gameDialog.close(); setStatus("会话已启动"); window.location.href = session.player_url;
        } catch (error) { setStatus(error.message, true); }
        finally { button.disabled = false; }
      }
      async function refreshIdentity() {
        if (!token()) { identity.textContent = "未配对"; return; }
        try { const user = await api("/api/browser/me"); identity.textContent = user.username || `用户 ${user.id}`; }
        catch (error) {
          if (error.status === 401) {
            localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(DEVICE_KEY); identity.textContent = "未配对";
          } else {
            identity.textContent = "已配对 · 连接待恢复";
          }
        }
      }
      function stopPairPolling() {
        if (polling) { clearInterval(polling); polling = null; }
        if (pairExpiryTimer) { clearTimeout(pairExpiryTimer); pairExpiryTimer = null; }
        pairPollBusy = false;
      }
      async function pair() {
        stopPairPolling(); pairDialog.showModal(); const box = document.getElementById("pair-state"); box.textContent = "正在创建配对请求...";
        try {
          const id = localStorage.getItem("romm-esde-browser-id") || createDeviceIdentifier(); localStorage.setItem("romm-esde-browser-id", id);
          const init = await api("/api/browser/pair/init", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ client_device_identifier: id, name: `浏览器 · ${navigator.platform || "设备"}` }) });
          const link = new URL(init.verification_path_complete, ROMM);
          const rommOrigin = new URL(ROMM).origin;
          if (link.origin !== rommOrigin) throw new Error("RomM 配对地址无效");
          box.replaceChildren();
          const prompt = document.createElement("span"); prompt.textContent = "请在 RomM 中批准：";
          const code = document.createElement("b"); code.textContent = init.user_code || "";
          const anchor = document.createElement("a"); anchor.href = link.href; anchor.target = "_blank"; anchor.rel = "noopener"; anchor.textContent = "打开 RomM 授权页面";
          box.append(prompt, code, anchor);
          const requestedExpiry = Number(init.expires_in);
          const expiresIn = Number.isFinite(requestedExpiry) && requestedExpiry > 0 ? Math.max(30, requestedExpiry) : 600;
          pairExpiryTimer = setTimeout(() => { stopPairPolling(); box.textContent = "配对请求已过期，请重新发起。"; }, expiresIn * 1000);
          polling = setInterval(async () => {
            if (pairPollBusy) return;
            pairPollBusy = true;
            try {
              const result = await api("/api/browser/pair/token", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ device_code: init.device_code }) });
              if (!result.access_token) return;
              stopPairPolling(); localStorage.setItem(TOKEN_KEY, result.access_token); localStorage.setItem(DEVICE_KEY, result.device_id || ""); pairDialog.close(); await refreshIdentity(); setStatus("浏览器配对完成");
            } catch (_) { /* RomM keeps pending requests in a non-error state. */ }
            finally { pairPollBusy = false; }
          }, Math.max(2000, Number(init.interval || 5) * 1000));
        } catch (error) { box.textContent = error.message; }
      }
      document.getElementById("pair").addEventListener("click", pair);
      document.getElementById("refresh").addEventListener("click", async () => { await load(); });
      document.getElementById("launch").addEventListener("click", launch);
      document.getElementById("dialog-close").addEventListener("click", () => gameDialog.close());
      document.getElementById("cancel").addEventListener("click", () => gameDialog.close());
      document.getElementById("pair-close").addEventListener("click", () => { stopPairPolling(); pairDialog.close(); });
      document.getElementById("pair-cancel").addEventListener("click", () => { stopPairPolling(); pairDialog.close(); });
      pairDialog.addEventListener("close", stopPairPolling);
      search.addEventListener("input", render);
      async function load() {
        setStatus("正在读取 manifest...");
        try {
          const response = await fetch(`${BRIDGE}/platforms/pc-9800-series/manifest.json`, { cache: "no-cache" });
          if (!response.ok) throw new Error("manifest 读取失败");
          manifest = await response.json(); render(); setStatus(""); await refreshIdentity();
          const requestedRom = Number(new URLSearchParams(location.search).get("rom"));
          if (requestedRom) { const game = manifest.roms.find(item => Number(item.id) === requestedRom); if (game) openGame(game); }
        }
        catch (error) { setStatus(error.message, true); }
      }
      load();
    })();
  </script>
</body>
</html>
